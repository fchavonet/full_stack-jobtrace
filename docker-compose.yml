services:
  database:
    image: postgres:17-alpine
    container_name: jobtrace-database
    environment:
      POSTGRES_DB: jobtrace_db
      POSTGRES_USER: jobtrace_user
      POSTGRES_PASSWORD: jobtrace_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U jobtrace_user -d jobtrace_db
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: jobtrace-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://jobtrace_user:jobtrace_password@database:5432/jobtrace_db
      NODE_ENV: development
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - document_uploads:/app/uploads/documents
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://localhost:4000/api/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: jobtrace-frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://localhost:8080
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  document_uploads:
  