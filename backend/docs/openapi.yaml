openapi: 3.0.3

info:
  title: "JobTrace - Backend: documentation"
  version: 0.1.0
  description: |
    JobTrace is a web application designed to help users track and organize
    their job applications in a clear and structured way.

    This OpenAPI documentation describes the backend API routes, request formats
    and responses used by the application.

servers:
- url: http://localhost:4000

tags:
- name: Health
  description: API and database health checks
- name: Authentication
  description: Registration, login, email verification and account management
- name: Profile
  description: User profile, settings and password management
- name: Applications
  description: Job application management
- name: Tags
  description: User tag management
- name: Contacts
  description: User contact management
- name: Documents
  description: Document upload, download and management
- name: Relations
  description: Application relations with tags, contacts and documents
- name: Achievements
  description: User achievement tracking

paths:
  /api/health:
    get:
      tags:
      - Health
      summary: Check API health
      responses:
        "200":
          description: API is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                success: true
                message: API is running.
                data:
                  status: ok

  /api/health/db:
    get:
      tags:
      - Health
      summary: Check database health
      responses:
        "200":
          description: Database connection is working.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                success: true
                message: Database connection is working.
                data:
                  status: ok
        "503":
          description: Database connection failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Database connection failed.
                errors: []

  /api/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully. Please check your email to 
            verify your account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                success: true
                message: User registered successfully. Please check your email 
                  to verify your account.
                data:
                  user:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    email: dick.grayson@example.com
                    firstName:
                    lastName:
                    avatarUrl:
                    emailVerified: false
                    theme: light
                    dailyGoal: 5
                    followUpDelayDays: 15
                    createdAt: "2026-06-22T17:12:37.374Z"
                    updatedAt: "2026-06-22T17:12:37.374Z"
        "400":
          description: Email or password validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emailRequired:
                  value:
                    success: false
                    message: Email is required.
                    errors: []
                invalidPassword:
                  value:
                    success: false
                    message: Password must contain at least 6 characters, one 
                      lowercase letter, one uppercase letter and one digit.
                    errors: []
        "409":
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Email is already registered.
                errors: []

  /api/auth/verify-email:
    get:
      tags:
      - Authentication
      summary: Verify user email address
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
        description: Replace this example with the email verification token received by email.
        example: email-verification-token-value
      responses:
        "200":
          description: Email verified successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                success: true
                message: Email verified successfully.
                data:
                  user:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    email: dick.grayson@example.com
                    firstName:
                    lastName:
                    avatarUrl:
                    emailVerified: true
                    theme: light
                    dailyGoal: 5
                    followUpDelayDays: 15
                    createdAt: "2026-06-22T17:12:37.374Z"
                    updatedAt: "2026-06-22T17:14:00.000Z"
        "400":
          description: Email verification token is missing, invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                tokenRequired:
                  value:
                    success: false
                    message: Email verification token is required.
                    errors: []
                invalidToken:
                  value:
                    success: false
                    message: Email verification token is invalid.
                    errors: []
                expiredToken:
                  value:
                    success: false
                    message: Email verification token has expired.
                    errors: []

  /api/auth/login:
    post:
      tags:
      - Authentication
      summary: Log in a verified user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: User logged in successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                success: true
                message: User logged in successfully.
                data:
                  user:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    email: dick.grayson@example.com
                    firstName: Dick
                    lastName: Grayson
                    avatarUrl:
                    emailVerified: true
                    theme: light
                    dailyGoal: 5
                    followUpDelayDays: 15
                    createdAt: "2026-06-22T17:12:37.374Z"
                    updatedAt: "2026-06-22T17:14:00.000Z"
                  token: jwt-token-value
        "400":
          description: Email or password validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emailRequired:
                  value:
                    success: false
                    message: Email is required.
                    errors: []
                passwordRequired:
                  value:
                    success: false
                    message: Password is required.
                    errors: []
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Invalid credentials.
                errors: []
        "403":
          description: Email must be verified before login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Email must be verified before login.
                errors: []

  /api/auth/me:
    get:
      tags:
      - Authentication
      summary: Get current authenticated user
      security:
      - JWT: []
      responses:
        "200":
          description: Current user retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: User not found.
                errors: []
    delete:
      tags:
      - Authentication
      summary: Delete current authenticated user account
      security:
      - JWT: []
      responses:
        "200":
          description: Account deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
              example:
                success: true
                message: Account deleted successfully.
                data: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: User not found.
                errors: []

  /api/auth/export:
    get:
      tags:
      - Authentication
      summary: Export authenticated user data
      security:
      - JWT: []
      responses:
        "200":
          description: User data exported successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: User not found.
                errors: []

  /api/auth/forgot-password:
    post:
      tags:
      - Authentication
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Password reset request processed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
              example:
                success: true
                message: Password reset request processed successfully.
                data: {}
        "400":
          description: Email validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emailRequired:
                  value:
                    success: false
                    message: Email is required.
                    errors: []
                emailInvalid:
                  value:
                    success: false
                    message: Email is invalid.
                    errors: []

  /api/auth/reset-password:
    post:
      tags:
      - Authentication
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
              example:
                success: true
                message: Password reset successfully.
                data: {}
        "400":
          description: Password reset token or password validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                tokenRequired:
                  value:
                    success: false
                    message: Password reset token is required.
                    errors: []
                invalidToken:
                  value:
                    success: false
                    message: Password reset token is invalid.
                    errors: []
                expiredToken:
                  value:
                    success: false
                    message: Password reset token has expired.
                    errors: []

  /api/profile:
    get:
      tags:
      - Profile
      summary: Get authenticated user profile
      security:
      - JWT: []
      responses:
        "200":
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"
    patch:
      tags:
      - Profile
      summary: Update authenticated user profile
      security:
      - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "400":
          description: Profile validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                firstNameTooLong:
                  value:
                    success: false
                    message: First name must contain at most 30 characters.
                    errors: []
                invalidLastName:
                  value:
                    success: false
                    message: Last name can only contain letters, spaces and 
                      hyphens.
                    errors: []
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/profile/settings:
    patch:
      tags:
      - Profile
      summary: Update authenticated user settings
      security:
      - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdateRequest"
      responses:
        "200":
          description: Settings updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "400":
          description: Settings validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidTheme:
                  value:
                    success: false
                    message: Theme must be light or dark.
                    errors: []
                missingSetting:
                  value:
                    success: false
                    message: At least one setting must be provided.
                    errors: []
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/profile/password:
    patch:
      tags:
      - Profile
      summary: Update authenticated user password
      security:
      - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordUpdateRequest"
      responses:
        "200":
          description: Password updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
              example:
                success: true
                message: Password updated successfully.
                data: {}
        "400":
          description: Password validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                currentPasswordRequired:
                  value:
                    success: false
                    message: Current password is required.
                    errors: []
                invalidNewPassword:
                  value:
                    success: false
                    message: New password must contain at least 6 characters, 
                      one lowercase letter, one uppercase letter and one digit.
                    errors: []
        "401":
          description: Authentication failed or current password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                tokenRequired:
                  value:
                    success: false
                    message: Authentication token is required.
                    errors: []
                currentPasswordIncorrect:
                  value:
                    success: false
                    message: Current password is incorrect.
                    errors: []
        "404":
          $ref: "#/components/responses/UserNotFound"

  /api/applications:
    get:
      tags:
      - Applications
      summary: List authenticated user applications
      security:
      - JWT: []
      responses:
        "200":
          description: Applications retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
      - Applications
      summary: Create a job application
      security:
      - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationRequest"
      responses:
        "201":
          description: Application created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "400":
          $ref: "#/components/responses/InvalidApplicationData"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/applications/{id}:
    get:
      tags:
      - Applications
      summary: Get one job application
      security:
      - JWT: []
      parameters:
      - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Application retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ApplicationNotFound"
    patch:
      tags:
      - Applications
      summary: Update one job application
      security:
      - JWT: []
      parameters:
      - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdateRequest"
      responses:
        "200":
          description: Application updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "400":
          $ref: "#/components/responses/InvalidApplicationData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ApplicationNotFound"
    delete:
      tags:
      - Applications
      summary: Delete one job application
      security:
      - JWT: []
      parameters:
      - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Application deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ApplicationNotFound"

  /api/applications/{id}/history:
    get:
      tags:
      - Applications
      summary: Get application history
      security:
      - JWT: []
      parameters:
      - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Application history retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationHistoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ApplicationNotFound"

  /api/tags:
    get:
      tags:
      - Tags
      summary: List authenticated user tags
      security:
      - JWT: []
      responses:
        "200":
          description: Tags retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
      - Tags
      summary: Create a tag
      security:
      - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagRequest"
      responses:
        "201":
          description: Tag created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/InvalidTagData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/TagAlreadyExists"

  /api/tags/{id}:
    get:
      tags:
      - Tags
      summary: Get one tag
      security:
      - JWT: []
      parameters:
      - $ref: "#/components/parameters/TagResourceId"
      responses:
        "200":
          description: Tag retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TagNotFound"
    patch:
      tags:
      - Tags
      summary: Update one tag
      security:
      - JWT: []
      parameters:
      - $ref: "#/components/parameters/TagResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUpdateRequest"
      responses:
        "200":
          description: Tag updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/InvalidTagData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TagNotFound"
        "409":
          $ref: "#/components/responses/TagAlreadyExists"
    delete:
      tags:
      - Tags
      summary: Delete one tag
      security:
      - JWT: []
      parameters:
      - $ref: "#/components/parameters/TagResourceId"
      responses:
        "200":
          description: Tag deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TagNotFound"

  /api/contacts:
    get:
      tags:
      - Contacts
      summary: List authenticated user contacts
      security:
      - JWT: []
      responses:
        "200":
          description: Contacts retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
      - Contacts
      summary: Create a contact
      security:
      - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "201":
          description: Contact created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "400":
          description: Contact validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingField:
                  value:
                    success: false
                    message: At least one contact field must be provided.
                    errors: []
                invalidEmail:
                  value:
                    success: false
                    message: Email must be valid.
                    errors: []
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/contacts/{id}:
    get:
      tags:
      - Contacts
      summary: Get one contact
      security:
      - JWT: []
      parameters:
      - $ref: "#/components/parameters/ContactResourceId"
      responses:
        "200":
          description: Contact retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ContactNotFound"
    patch:
      tags:
      - Contacts
      summary: Update one contact
      security:
      - JWT: []
      parameters:
      - $ref: "#/components/parameters/ContactResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "200":
          description: Contact updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "400":
          description: Contact validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingField:
                  value:
                    success: false
                    message: At least one valid contact field must be provided.
                    errors: []
                invalidEmail:
                  value:
                    success: false
                    message: Email must be valid.
                    errors: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ContactNotFound"
    delete:
      tags:
      - Contacts
      summary: Delete one contact
      security:
      - JWT: []
      parameters:
      - $ref: "#/components/parameters/ContactResourceId"
      responses:
        "200":
          description: Contact deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ContactNotFound"

  /api/documents:
    get:
      tags:
      - Documents
      summary: List authenticated user documents
      security:
      - JWT: []
      responses:
        "200":
          description: Documents retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
      - Documents
      summary: Upload a document
      security:
      - JWT: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUploadRequest"
      responses:
        "201":
          description: Document uploaded successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          description: Document validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingFile:
                  value:
                    success: false
                    message: Invalid document data.
                    errors:
                    - Document file is required.
                invalidType:
                  value:
                    success: false
                    message: Invalid document data.
                    errors:
                    - Document type is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Uploaded file type or size is rejected by the upload 
            middleware.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Only PDF, DOC, DOCX, PNG, JPG and JPEG files are 
                  allowed.
                errors: []

  /api/documents/{id}:
    get:
      tags:
      - Documents
      summary: Get one document
      security:
      - JWT: []
      parameters:
      - $ref: "#/components/parameters/DocumentResourceId"
      responses:
        "200":
          description: Document retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
