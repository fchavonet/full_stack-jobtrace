          format: uuid
        company:
          type: string
        position:
          type: string
        status:
          type: string
        contractType:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        salary:
          type: integer
          nullable: true
        link:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        sentAt:
          type: string
          format: date-time
          nullable: true
        followUpAt:
          type: string
          format: date-time
