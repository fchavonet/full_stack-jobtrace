components:
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste the JWT token returned by POST /api/auth/login.

  parameters:
    ApplicationId:
      name: id
      in: path
      required: true
      description: Replace this example with an application id returned by POST /api/applications or GET /api/applications.
      schema:
        type: string
        format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    TagResourceId:
      name: id
      in: path
      required: true
      description: Replace this example with a tag id returned by POST /api/tags or GET /api/tags.
      schema:
        type: string
        format: uuid
      example: 41608063-9c56-4d46-a3ff-65797479a729

    ContactResourceId:
      name: id
      in: path
      required: true
      description: Replace this example with a contact id returned by POST /api/contacts or GET /api/contacts.
      schema:
        type: string
        format: uuid
      example: 6b4ed426-b5b4-4b70-8a3f-00ec0d0135bb

    DocumentResourceId:
      name: id
      in: path
      required: true
      description: Replace this example with a document id returned by POST /api/documents or GET /api/documents.
      schema:
        type: string
        format: uuid
      example: 0fc9cdb6-9f14-48fa-9f1f-a1b492c79bb3

    LinkedTagId:
      name: tagId
      in: path
      required: true
      description: Replace this example with a tag id returned by POST /api/tags or GET /api/tags.
      schema:
        type: string
        format: uuid
      example: 41608063-9c56-4d46-a3ff-65797479a729

    LinkedContactId:
      name: contactId
      in: path
      required: true
      description: Replace this example with a contact id returned by POST /api/contacts or GET /api/contacts.
      schema:
        type: string
        format: uuid
      example: 6b4ed426-b5b4-4b70-8a3f-00ec0d0135bb

    LinkedDocumentId:
      name: documentId
      in: path
      required: true
      description: Replace this example with a document id returned by POST /api/documents or GET /api/documents.
      schema:
        type: string
        format: uuid
      example: 0fc9cdb6-9f14-48fa-9f1f-a1b492c79bb3

  responses:
    Unauthorized:
      description: Authentication token is missing, malformed, invalid or 
        expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missingToken:
              value:
                success: false
                message: Authentication token is required.
                errors: []
            invalidFormat:
              value:
                success: false
                message: Authentication token format is invalid.
                errors: []
            invalidOrExpired:
              value:
                success: false
                message: Authentication token is invalid or expired.
                errors: []

    UserNotFound:
      description: User not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: User not found.
            errors: []

    ApplicationNotFound:
      description: Application not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Application not found.
            errors: []

    TagNotFound:
      description: Tag not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Tag not found.
            errors: []

    ContactNotFound:
      description: Contact not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Contact not found.
            errors: []

    DocumentNotFound:
      description: Document not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Document not found.
            errors: []

    TagAlreadyExists:
      description: Tag already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Tag already exists.
            errors: []

    InvalidApplicationData:
      description: Invalid application data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Invalid application data.
            errors:
            - Company is required.
            - Position is required.
            - Status is required.
            - Sent date is required and must be valid.

    InvalidTagData:
      description: Invalid tag data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Invalid tag data.
            errors:
            - Tag name is required.

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully.
        data:
          type: object
          additionalProperties: true

    EmptySuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully.
        data:
          type: object
          example: {}

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Error message.
        errors:
          type: array
          items:
            type: string
          example: []

    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: API is running.
        data:
          type: object
          properties:
            status:
              type: string
              example: ok

    RegisterRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: dick.grayson@example.com
          description: Use a real email address so the verification email can be
            received.
        password:
          type: string
          format: password
          example: Password42
          description: Must contain at least 6 characters, one lowercase letter,
            one uppercase letter and one digit.

    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: dick.grayson@example.com
          description: Email of a verified user account.
        password:
          type: string
          format: password
          example: Password42
          description: Password of the verified user account.
    ForgotPasswordRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
          example: dick.grayson@example.com
          description: Email address linked to the account.
    ResetPasswordRequest:
      type: object
      required:
      - token
      - password
      properties:
        token:
          type: string
          example: password-reset-token-value
          description: Password reset token received by email.
        password:
          type: string
          format: password
          example: NewPassword42
          description: Must contain at least 6 characters, one lowercase letter,
            one uppercase letter and one digit.
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        emailVerified:
          type: boolean
        theme:
          type: string
          example: light
        dailyGoal:
          type: integer
          example: 5
        followUpDelayDays:
          type: integer
          example: 15
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Current user retrieved successfully.
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User logged in successfully.
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
            token:
              type: string
              example: jwt-token-value

    ExportResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User data exported successfully.
        data:
          type: object
          properties:
            exportedAt:
              type: string
              format: date-time
            user:
              $ref: "#/components/schemas/User"
            applications:
              type: array
              items:
                $ref: "#/components/schemas/Application"
            contacts:
              type: array
              items:
                $ref: "#/components/schemas/Contact"
            documents:
              type: array
              items:
                $ref: "#/components/schemas/Document"
            tags:
              type: array
              items:
                $ref: "#/components/schemas/Tag"

    ProfileUpdateRequest:
      type: object
      properties:
        firstName:
          type: string
          nullable: true
          example: Dick
        lastName:
          type: string
          nullable: true
          example: Grayson
        avatarUrl:
          type: string
          nullable: true
          example: https://example.com/avatar.png

    SettingsUpdateRequest:
      type: object
      properties:
        theme:
          type: string
          enum:
          - light
          - dark
          example: dark
          description: 'Allowed values: light or dark.'
        dailyGoal:
          type: integer
          minimum: 1
          maximum: 50
          example: 10
          description: Daily application goal. Use a number between 1 and 50.
        followUpDelayDays:
          type: integer
          minimum: 1
          maximum: 90
          example: 30
          description: Follow-up delay in days. Use a number between 1 and 90.
    PasswordUpdateRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          example: Password42
        newPassword:
          type: string
          format: password
          example: NewPassword42

    ProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Profile retrieved successfully.
        data:
          type: object
          properties:
            profile:
              $ref: "#/components/schemas/User"

    ApplicationRequest:
      type: object
