        link:
          type: string
          nullable: true
          example: https://example.com/job-offer
        notes:
          type: string
          nullable: true
          example: Updated application notes.
        sentAt:
          type: string
          format: date
          example: 2026-06-22
        followUpAt:
          type: string
          format: date
          nullable: true
          example: 2026-07-07
        interviewAt:
          type: string
          format: date
          nullable: true
          example: 2026-07-12

    Application:
